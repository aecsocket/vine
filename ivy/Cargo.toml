[package]
name = "ivy"
version = "0.0.0"
edition = "2024"

[dependencies]
unicode-id-start = "1.4.0"
vine-util = { path = "../util", default-features = false }
hashbrown = "0.14.5"
derive_more = { version = "2.1.1", default-features = false, features = ["display", "error"] }

[features]
default = ["std"]
std = ["vine-util/std", "derive_more/std"]
