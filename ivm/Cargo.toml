[package]
name = "ivm"
version = "0.0.0"
edition = "2024"

[dependencies]
ivy = { path = "../ivy", default-features = false }
vine-util = { path = "../util", default-features = false }
hashbrown = "0.14.5"

[lints.clippy]
absolute_paths = "warn"
std_instead_of_alloc = "warn"
alloc_instead_of_core = "warn"

[features]
default = ["std"]
std = ["ivy/std"]
