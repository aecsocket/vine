[package]
name = "ivmetal"
version = "0.0.0"
edition = "2024"

[dependencies]
ivy = { path = "../ivy", default-features = false }
ivm = { path = "../ivm", default-features = false }
vine-util = { path = "../util", default-features = false }
uefi = { version = "0.41.0", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
embedded-graphics = { version = "0.8.2", default-features = false }
embedded-graphics-core = { version = "0.4.1", default-features = false }
log = { version = "0.4.34", default-features = false }
anyhow = { version = "1.0.104", default-features = false }
